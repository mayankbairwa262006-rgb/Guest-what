<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: radial-gradient(circle at center,
        #40104f 0%,
        #180b2d 45%,
        #05000d 100%);
    font-family: Arial, sans-serif;
}

.scene {
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Stars */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .2;
        transform: scale(.5);
    }
    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* Moon */
.moon {
    position: absolute;
    top: 60px;
    right: 45px;
    width: 75px;
    height: 75px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 40px #fff;
}

/* Ground */
.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 27%;
    background: linear-gradient(to top, #030006, transparent);
}

/* Couple */
.couple {
    position: relative;
    width: 330px;
    height: 300px;
    z-index: 5;
}

/* Boy */
.boy {
    position: absolute;
    left: 0;
    bottom: 20px;
    font-size: 105px;
    transform: translateX(-180px);
    transition: 2s cubic-bezier(.2,.8,.2,1);
}

/* Girl */
.girl {
    position: absolute;
    right: 0;
    bottom: 20px;
    font-size: 105px;
    transform: translateX(180px);
    transition: 2s cubic-bezier(.2,.8,.2,1);
}

/* Move together */
.couple.active .boy {
    transform: translateX(55px);
}

.couple.active .girl {
    transform: translateX(-55px);
}

/* Heart between them */
.big-heart {
    position: absolute;
    left: 50%;
    top: 75px;
    transform: translate(-50%, 0) scale(0);
    font-size: 55px;
    opacity: 0;
    z-index: 10;
    transition: 1s;
}

.couple.active .big-heart {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: translate(-50%,0) scale(1);
    }
    50% {
        transform: translate(-50%,0) scale(1.3);
    }
}

/* Main text */
.message {
    position: absolute;
    bottom: 100px;
    text-align: center;
    color: white;
    opacity: 0;
    transform: translateY(30px);
    transition: 1.5s;
    z-index: 20;
}

.message.show {
    opacity: 1;
    transform: translateY(0);
}

.message h1 {
    font-size: 43px;
    letter-spacing: 3px;
    text-shadow:
        0 0 10px #ff4f9a,
        0 0 30px #ff1493;
}

.message p {
    margin-top: 10px;
    font-size: 17px;
    color: #ffd7ea;
}

/* Button */
#start {
    position: absolute;
    bottom: 35px;
    z-index: 50;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    background: linear-gradient(90deg,#ff4f81,#ff1493);
    color: white;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 0 25px #ff1493;
    cursor: pointer;
}

#start:active {
    transform: scale(.94);
}

/* Floating hearts */
.floating-heart {
    position: absolute;
    bottom: -30px;
    color: #ff4f9a;
    font-size: 20px;
    animation: floatUp 5s linear forwards;
    z-index: 3;
}

@keyframes floatUp {
    0% {
        opacity: 0;
        transform: translateY(0) scale(.5);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-100vh) scale(1.5);
    }
}

/* Mobile */
@media(max-width:500px) {

    .couple {
        width: 280px;
    }

    .boy,
    .girl {
        font-size: 90px;
    }

    .message h1 {
        font-size: 32px;
    }

    .moon {
        right: 25px;
        top: 40px;
        width: 55px;
        height: 55px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="moon"></div>

    <!-- Stars -->
    <div id="stars"></div>

    <div class="couple" id="couple">

        <div class="boy"></div>

        <div class="big-heart">❤️</div>

        <div class="girl"></div>

    </div>

    <div class="ground"></div>

    <div class="message" id="message">
        <h1>I LOVE YOU ❤️</h1>
        <p align="center"> Tumse milkar ye ehsaas hua,
Jaise adhoora khwaab poora hua.
Lafz kam pad jaate hain tumhe batane mein,
Bas itna samajh lo… Tumse Pyaar Hua ❤️✨</p>
    </div>

    <button id="start">Tap Here ❤️</button>

</div>

<script>

/* Create stars */
for(let i = 0; i < 70; i++){

    let star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random()*100 + "vw";
    star.style.top = Math.random()*75 + "vh";

    star.style.animationDelay =
        Math.random()*2 + "s";

    document.getElementById("stars")
        .appendChild(star);
}


/* Start animation */
document.getElementById("start")
.addEventListener("click", function(){

    document.getElementById("couple")
        .classList.add("active");

    setTimeout(function(){

        document.getElementById("message")
            .classList.add("show");

    },1800);

    this.style.display = "none";

    /* Hearts */
    setInterval(function(){

        let heart =
            document.createElement("div");

        heart.className =
            "floating-heart";

        heart.innerHTML =
            Math.random() > .5 ? "❤️" : "💗";

        heart.style.left =
            Math.random()*100 + "vw";

        heart.style.fontSize =
            (15 + Math.random()*25) + "px";

        document.body.appendChild(heart);

        setTimeout(function(){
            heart.remove();
        },5000);

    },250);

});

</script>

</body>
</html>
